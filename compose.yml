x-container: &container
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  textfold:
    <<: *container
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: reader
    network_mode: none
    environment:
      TEXTFOLD_PORT: "${TEXTFOLD_PORT:-3017}"
      TEXTFOLD_NO_MODELS: "1"
      TEXTFOLD_TAILSCALE_HOST: "${TEXTFOLD_TAILSCALE_HOST:-}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - library:/data
      - relay:/run/textfold-relay
    healthcheck:
      test: [CMD, python, -I, -B, /opt/textfold-docker/transport.py, check-reader]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  browser:
    <<: *container
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: browser
    depends_on:
      textfold:
        condition: service_healthy
    environment:
      TEXTFOLD_PORT: "${TEXTFOLD_PORT:-3017}"
    ports:
      - "127.0.0.1:${TEXTFOLD_PORT:-3017}:${TEXTFOLD_PORT:-3017}"
    volumes:
      - relay:/run/textfold-relay:ro
    healthcheck:
      test: [CMD, python, -I, -B, /opt/textfold-docker/transport.py, check-browser]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  library:
  relay:
