name: Verify local Docker

on:
  pull_request:
    paths:
      - compose*.yml
      - .dockerignore
      - .github/workflows/docker.yml
      - docker/**
      - tests/test_openai_transport.py
      - textfold/**
      - requirements.txt
  push:
    branches: [main]
    paths:
      - compose*.yml
      - .dockerignore
      - .github/workflows/docker.yml
      - docker/**
      - tests/test_openai_transport.py
      - textfold/**
      - requirements.txt

permissions:
  contents: read

jobs:
  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps: &compose-steps
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_openai_transport.py
      - run: python3 docker/smoke.py
  compose-arm64:
    name: Compose smoke test (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps: *compose-steps
