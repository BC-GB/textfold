# Python payloads are built and tested on their target platforms without signing credentials.
# A fresh runner packages each artifact. Only the Mac packaging step receives signing credentials.
# Tagged builds publish together after all three packages are available.
name: desktop
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, textfold-reviewed]
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/requirements-*.txt'
      - 'desktop/scripts/prepare-payload.mjs'
      - 'desktop/scripts/build-mac-intel-crypto.sh'
  workflow_dispatch:
    inputs:
      version:
        description: "App version for testing updates. Empty uses the version in the code."
        required: false
        default: ''
      sign:
        description: "Sign macOS builds with the configured credentials"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the version in the code, desktop app, and tag
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' textfold/__init__.py)
          app=$(node -p "require('./desktop/package.json').version")
          test "$code" = "$app" || { echo "textfold $code, desktop/package.json $app"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$code" || { echo "tag $GITHUB_REF_NAME, code $code"; exit 1; }
          fi
      - name: Test desktop and browser scripts
        run: node --test desktop/*.test.js tests/*.test.cjs

  payload:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-15, platform: darwin, arch: arm64 }
          - { name: mac-x64, os: macos-15-intel, platform: darwin, arch: x64 }
          - { name: win-x64, os: windows-latest, platform: win32, arch: x64 }
    name: Python payload (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the locked Python payload
        working-directory: desktop
        run: node scripts/prepare-payload.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Test the bundled Python and TextFold
        working-directory: desktop
        shell: bash
        run: |
          payload_python=payload/python/bin/python3
          [ -x "$payload_python" ] || payload_python=payload/python/python.exe
          "$payload_python" -I -m pip check
          "$payload_python" scripts/smoke.py
      - name: Archive the tested payload
        working-directory: desktop
        shell: bash
        run: tar -czf payload.tar.gz payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-payload-${{ matrix.name }}
          path: desktop/payload.tar.gz
          if-no-files-found: error

  build:
    needs: payload
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 15 is compatible with electron-builder's temporary signing keychain.
          - { name: mac-arm64, os: macos-15, arch: arm64 }
          - { name: mac-x64, os: macos-15-intel, arch: x64 }
          - { name: win-x64, os: windows-latest, arch: x64 }
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-payload-${{ matrix.name }}
          path: desktop
      - name: Unpack the tested payload
        working-directory: desktop
        shell: bash
        run: tar -xzf payload.tar.gz
      - name: Package the Windows installer
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: npm exec --offline -- electron-builder --win nsis --x64 --publish never ${VERSION:+"-c.extraMetadata.version=$VERSION"}
        env:
          VERSION: ${{ inputs.version }}
      - name: Package the macOS installer and update archive
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && ( -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" || -z "$APPLE_ID" ||
            -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ) ]]; then
            echo "A macOS signing or notarization credential is missing."
            exit 1
          fi
          sign_args=()
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            sign_args=(-c.mac.identity=null -c.mac.notarize=false)
          fi
          npm exec --offline -- electron-builder --mac dmg zip --${{ matrix.arch }} --publish never \
            "${sign_args[@]}" ${VERSION:+"-c.extraMetadata.version=$VERSION"}
        env:
          VERSION: ${{ inputs.version }}
          CSC_LINK: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && secrets.MAC_CERT_PASSWORD && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: textfold-${{ matrix.name }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.blockmap
            desktop/out/latest*.yml
          if-no-files-found: error

  manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: textfold-*
          path: packages
      - name: Combine both Mac update manifests
        run: |
          python3 desktop/scripts/latest-mac.py packages/textfold-mac-arm64/latest-mac.yml \
            packages/textfold-mac-x64/latest-mac.yml > latest-mac.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: textfold-mac-update
          path: latest-mac.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, manifests]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: textfold-*
          path: packages
      - name: Publish the complete release
        shell: bash
        run: |
          shopt -s nullglob
          files=(packages/textfold-*/*.dmg packages/textfold-*/*.zip packages/textfold-*/*.exe packages/textfold-*/*.blockmap)
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --draft --title "TextFold ${TAG#v}" --notes "Desktop packages."
          gh release upload "$TAG" "${files[@]}" packages/textfold-win-x64/latest.yml packages/textfold-mac-update/latest-mac.yml -R "$REPO" --clobber
          gh release edit "$TAG" -R "$REPO" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
