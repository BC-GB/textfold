name: Verify Windows installer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test the desktop scripts
        run: node --test desktop/*.test.js tests/*.test.cjs
      - name: Build Windows x64 from locked dependencies
        working-directory: desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win
      - name: Test the bundled Windows Python
        working-directory: desktop
        run: |
          & .\payload\python\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\payload\python\python.exe scripts\smoke.py
      - name: Install and exercise the packaged app
        working-directory: desktop
        run: |
          $setup = Get-Item out\TextFold-win-x64-setup.exe
          $folder = Join-Path $env:RUNNER_TEMP "TextFold-installed"
          $installer = Start-Process $setup.FullName -ArgumentList "/S", "/D=$folder" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer exited with $($installer.ExitCode)" }
          node scripts/smoke-installed.mjs (Join-Path $folder "TextFold.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "commit: $(git rev-parse HEAD)"
            "sha256: $((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            "signature: $((Get-AuthenticodeSignature $setup.FullName).Status)"
            "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content out\windows-provenance.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: textfold-windows-x64-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/out/TextFold-win-x64-setup.exe
            desktop/out/windows-provenance.txt
