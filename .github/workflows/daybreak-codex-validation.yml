name: Validate Codex document isolation
on:
  pull_request:
    branches: [textfold-reviewed]
    paths:
      - 'textfold/agents.py'
      - 'tools/check-codex-profile.py'
      - '.github/workflows/daybreak-codex-validation.yml'
permissions:
  contents: read
jobs:
  codex-profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the published Codex CLI in the runner's scratch space
        shell: bash
        run: npm install --prefix "${{ runner.temp }}/textfold-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.172.0
      - name: Verify generation and the scratch-only filesystem policy
        run: python3 tools/check-codex-profile.py
